zend_extension=xdebug.so
xdebug.idekey=BASERCMS
xdebug.client_host=host.docker.internal
xdebug.client_port=9003
xdebug.mode=debug,develop
xdebug.log_level=0

; Xdebug はトリガーがあるときだけ起動する（常時起動は PHP 側の処理時間が 15% 程度増えるため）。
; 起動方法:
;   - ブラウザ: Xdebug Helper 等の拡張で XDEBUG_SESSION Cookie を付ける、または URL に ?XDEBUG_TRIGGER=1 を付ける
;   - CLI / phpunit: docker exec -e XDEBUG_TRIGGER=1 <container> vendor/bin/phpunit ...
;   - PhpStorm の Debug 実行は自動でトリガーが付く
; 常時起動に戻す場合は、コンテナの環境変数に XDEBUG_SESSION=1 を渡す（環境変数もトリガーとして認識される）。
xdebug.start_with_request=trigger
xdebug.trigger_value=
